<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>文献译读</title>
    <link rel="stylesheet" href="ui.css">
    <style>
      body { width: 360px; }
      main { padding: 20px 18px 16px; }
      header { padding: 0 4px 16px; }
      h1 { margin: 0 0 4px; font-size: 28px; line-height: 1.3; font-weight: 700; letter-spacing: -.04em; }
      p { margin: 0; }
      .subtitle { color: var(--muted); font-size: 12px; }
      .group { background: var(--surface); border-radius: 16px; margin-bottom: 12px; overflow: hidden; }
      .switch-group, .model { padding: 14px 16px; }
      .switch-help { margin-top: 10px; font-size: 12px; color: var(--muted); }
      .section-label { margin: 0 0 6px 14px; color: var(--muted); font-size: 11px; font-weight: 500; }
      .label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
      #model-name { display: block; font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
      #status { margin-top: 8px; color: var(--muted); font-size: 12px; line-height: 1.65; overflow-wrap: anywhere; }
      #status[data-state="error"] { color: var(--error); }
      .pdf-actions { display: grid; }
      .pdf-actions button { text-align: left; border: 0; background: transparent; color: var(--blue); padding: 11px 16px; min-height: 44px; display: flex; justify-content: space-between; align-items: center; }
      .pdf-actions button + button { border-top: 1px solid var(--line); }
      .pdf-actions button:hover { background: #eef5ff; }
      .chevron { font-size: 20px; color: #aeaeb2; line-height: 1; }
      #pdf-status { padding: 0 14px; font-size: 12px; color: var(--error); }
      #pdf-status:empty { display: none; }
      .help { padding: 0 4px; font-size: 12px; color: var(--muted); }
      .help p + p { margin-top: 6px; }
      footer { margin-top: 12px; padding: 10px 4px 0; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; line-height: 1.65; }
    </style>
    <script src="plugin-control.js" defer></script>
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <h1>文献译读</h1>
        <p class="subtitle">网页与 PDF 选区 → 中文科研表达</p>
      </header>
      <section class="group switch-group" aria-label="翻译开关">
        <div class="toggle-row">
          <span id="plugin-toggle-title" class="toggle-title">启用翻译</span>
          <div class="toggle-meta">
            <span id="plugin-state-label" aria-live="polite">读取中…</span>
            <button id="plugin-toggle" class="ios-switch" type="button" role="switch" aria-checked="false" aria-labelledby="plugin-toggle-title" aria-describedby="plugin-switch-help" disabled></button>
          </div>
        </div>
        <p id="plugin-switch-help" class="switch-help">控制所有网页与 PDF 的翻译，自动记住开关状态。</p>
        <p id="plugin-status" role="status" aria-live="polite"></p>
      </section>
      <p class="section-label">翻译模型</p>
      <section class="group model" aria-label="已加载模型">
        <span class="label">当前已加载模型</span>
        <strong id="model-name">读取中…</strong>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
      <p class="section-label">文献阅读</p>
      <section class="group pdf-actions" aria-label="PDF 阅读">
        <button id="open-pdf" type="button"><span>打开 PDF 阅读器</span><span class="chevron" aria-hidden="true">›</span></button>
        <button id="open-current-pdf" type="button"><span>使用当前页面地址打开 PDF</span><span class="chevron" aria-hidden="true">›</span></button>
      </section>
      <p id="pdf-status" role="status" aria-live="polite"></p>
      <section class="help" aria-label="使用说明">
        <p>选中英文后按 <kbd>Y</kbd> 翻译，按 <kbd>Esc</kbd> 收起译文。</p>
        <p>修改模型：编辑 <code>config.json</code>，重新加载插件并刷新阅读页面。</p>
      </section>
      <footer>本地 PDF 可选择或拖入阅读器，扫描版暂不支持。关闭翻译后仍可阅读 PDF。请勿分享含密钥的扩展包。</footer>
    </main>
  </body>
</html>
